<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vector Bay, the marina city of the Azure Coast in Fyrus.">
<title>Vector Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600&family=Sora:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed WebGL film, quiet glass chrome in the corners, Fyrus navy + champagne gold */
:root{
  --ink:#0a0f1a; --ink-2:#111a2b; --glass:rgba(10,15,26,.58); --line:rgba(201,169,110,.38);
  --gold:#c9a96e; --gold-hi:#e8d5a8; --ivory:#f4efe6; --muted:#9aa3b2;
  --display:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --head:'Sora','Segoe UI',system-ui,sans-serif;
  --body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--ivory);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.chrome{position:fixed;inset:0;pointer-events:none;z-index:5;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.ring{width:30px;height:30px;border-radius:50%;border:2px solid #ff9a3c;display:grid;place-items:center;box-shadow:0 0 18px rgba(255,154,60,.35)}
.ring i{width:8px;height:8px;border-radius:50%;background:#ff9a3c}
.brand b{font-family:var(--head);font-weight:700;letter-spacing:.32em;font-size:13px}
.brand span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--gold-hi);opacity:.85;margin-top:3px}
.back{pointer-events:auto;text-decoration:none;cursor:pointer}.back:hover{border-color:var(--gold-hi)}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-hi);border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:7px 11px;border-radius:999px}
.dock{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
.seg{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg button{font:600 10.5px/1 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--ivory);background:transparent;border:0;border-radius:999px;padding:8px 12px;cursor:pointer;opacity:.72}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);opacity:1}
.seg button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.cap{max-width:min(560px,100%);transition:opacity .9s ease,transform .9s ease}
.cap.out{opacity:0;transform:translateY(8px)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-hi)}
.eyebrow::before{content:"";display:inline-block;width:28px;height:1px;background:var(--gold);vertical-align:middle;margin-right:10px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(54px,9vw,112px);line-height:.9;letter-spacing:.02em;margin:10px 0 6px;color:var(--ivory);text-shadow:0 2px 30px rgba(0,0,0,.35);text-wrap:balance}
.sub{font-size:15px;line-height:1.5;color:#efe6d6;max-width:46ch;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.hint{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);margin-top:12px;text-transform:uppercase}
.bars{position:fixed;left:0;right:0;height:7vh;background:#000;z-index:4;pointer-events:none;transition:height 1.2s ease}
.bars.t{top:0}.bars.b{bottom:0}
body.explore .bars{height:0}
.fade{position:fixed;inset:0;background:#000;opacity:0;z-index:6;pointer-events:none;transition:opacity .7s ease}
#load{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 50% 60%,#1a2336 0%,var(--ink) 70%);display:grid;place-items:center;transition:opacity 1.2s ease}
#load.done{opacity:0;pointer-events:none}
.lbox{text-align:center;padding-inline:16px}
.lbox h2{font-family:var(--display);font-weight:400;font-size:clamp(44px,8vw,78px);letter-spacing:.12em;margin:14px 0 4px;color:var(--ivory)}
.lbox p{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--gold-hi);text-transform:uppercase;margin:0}
.track{width:min(320px,70vw);height:1px;background:rgba(201,169,110,.25);margin:26px auto 12px;position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);box-shadow:0 0 12px var(--gold);transition:width .3s ease}
#lstep{color:var(--muted)}
#prompt{position:fixed;left:50%;bottom:calc(9vh + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font:600 12px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-hi);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;pointer-events:auto;white-space:nowrap}
#prompt kbd{font:600 11px var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-right:8px;color:var(--ivory)}
#stick{position:fixed;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:1px solid var(--line);background:rgba(10,15,26,.35);z-index:7;display:none;touch-action:none}
#stick i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(232,213,168,.6)}
body.walk.touch #stick{display:block}
.vbp{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:rgba(5,8,15,.6);padding-inline:max(16px,env(safe-area-inset-left,0px))}
.vbp[hidden],#prompt[hidden]{display:none}
.vbp-card{width:min(520px,100%);background:linear-gradient(180deg,var(--ink-2),var(--ink));border:1px solid var(--line);border-radius:20px;padding:24px}
.vbp-card h2{font-family:var(--display);font-weight:400;font-size:46px;line-height:.95;margin:8px 0;letter-spacing:.03em}
.vbp-card p{color:var(--muted);line-height:1.55;font-size:14px;margin:0 0 18px}
.vbp-btns{display:flex;gap:10px;flex-wrap:wrap}
.vbp-btns button,.vbp-btns a{font:600 11px var(--head);letter-spacing:.16em;text-transform:uppercase;border-radius:999px;padding:11px 18px;border:1px solid var(--line);background:transparent;color:var(--gold-hi);cursor:pointer;text-decoration:none}
.vbp-btns .gold{background:var(--gold);color:var(--ink);border-color:var(--gold)}
body.walk .bars{height:0}
#err{display:none;max-width:52ch;margin:18px auto 0;font-size:13px;color:#ffcf9e;line-height:1.5}
@media (max-width:640px){.sub{font-size:13.5px}.seg button{padding:7px 9px;font-size:9.5px}.bars{height:4vh}}
@media (prefers-reduced-motion:reduce){.cap,.fade,#load{transition:none}}
</style>
</head>
<body>


<canvas id="c" aria-label="Vector Bay, a 3D concept city on the Azure Coast of Fyrus"></canvas>
<div class="bars t"></div><div class="bars b"></div>
<div class="fade" id="fade"></div>

<div class="chrome">
  <div class="top">
    <div class="brand"><div class="ring"><i></i></div><div><b>FYRUS</b><span>THE AZURE COAST</span></div></div>
    <div class="dock">
      <a class="chip back" href="/" id="bBack">← Fyrus Core</a>
      <div class="seg" role="group" aria-label="Camera">
        <button id="bCine" aria-pressed="true">Cinematic</button>
        <button id="bFree" aria-pressed="false">Explore</button>
        <button id="bWalk" aria-pressed="false">Walk</button>
      </div>
      <div class="seg" role="group" aria-label="Time of day">
        <button data-t="golden" aria-pressed="false">Golden</button>
        <button data-t="sunset" aria-pressed="true">Sunset</button>
        <button data-t="blue" aria-pressed="false">Blue hour</button>
      </div>
      <div class="seg" role="group" aria-label="Extras">
        <button id="bSound" aria-pressed="false">Sound</button>
        <button id="bQ" aria-pressed="false">Quality: High</button>
      </div>
    </div>
  </div>
  <div class="cap" id="cap">
    <div class="eyebrow" id="capE">Fyrus · The Azure Coast</div>
    <h1 id="capT">Vector Bay</h1>
    <div class="sub" id="capS">Marble promenade, gilded towers and the old harbour of House Maren.</div>
    <div class="hint" id="capH">Cinematic tour · Explore to fly, Walk to stroll the promenade</div>
  </div>
</div>

<div id="prompt" role="status" aria-live="polite" hidden></div>
<div id="stick" aria-hidden="true"><i></i></div>
<div id="vbPanel" class="vbp" hidden role="dialog" aria-modal="true"><div class="vbp-card"><div class="eyebrow" id="vbpE"></div><h2 id="vbpT"></h2><p id="vbpS"></p><div class="vbp-btns" id="vbpB"></div></div></div>
<div id="load">
  <div class="lbox">
    <div class="ring" style="margin:0 auto;width:44px;height:44px"><i style="width:12px;height:12px"></i></div>
    <h2>VECTOR BAY</h2>
    <p>The Azure Coast · House Maren</p>
    <div class="track"><i id="lbar"></i></div>
    <p id="lstep">Raising the sea</p>
    <div id="err"></div>
  </div>
</div>

<script type="importmap">

</script>
